<svg width="214" height="48" viewBox="0 0 214 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cloud Eagle Icon (scaled to fit) -->
  <g transform="translate(6, 6) scale(0.3)">
    <rect width="120" height="120" rx="10" fill="#4BB649"/>
    <!-- 云朵 -->
    <path d="M 10 90 C 15 75, 30 70, 40 80 C 50 65, 75 60, 85 75 C 95 65, 115 70, 115 90 Z" fill="white" fill-opacity="0.3"/>
    <path d="M 0 100 C 20 85, 40 90, 50 100 C 65 85, 90 85, 120 100 L 120 120 L 0 120 Z" fill="white" fill-opacity="0.6"/>
    <!-- 雄鹰 -->
    <g transform="translate(60, 45) scale(1.1)">
      <!-- 鹰头 -->
      <path d="M 0 -15 C 5 -25, 15 -20, 10 -10 C 5 -5, -5 -10, 0 -15 Z" fill="white"/>
      <!-- 喙 -->
      <path d="M 12 -18 L 20 -15 L 12 -12 Z" fill="#FDE047"/>
      <!-- 身体 -->
      <path d="M -5 -10 C -15 5, -5 20, 5 15 C 10 5, 5 -5, -5 -10 Z" fill="white"/>
      <!-- 左翼 -->
      <path d="M -10 -5 C -30 -15, -45 -30, -50 -45 C -35 -20, -15 -5, -10 5 Z" fill="white"/>
      <path d="M -8 0 C -25 -10, -40 -15, -45 -25 C -30 -10, -15 0, -5 8 Z" fill="white" opacity="0.8"/>
      <!-- 右翼 -->
      <path d="M 5 -5 C 25 -20, 45 -25, 50 -45 C 35 -15, 15 -5, 10 5 Z" fill="white"/>
      <path d="M 7 0 C 25 -10, 40 -10, 45 -20 C 30 -5, 15 5, 5 8 Z" fill="white" opacity="0.8"/>
      <!-- 尾巴 -->
      <path d="M -2 15 L -10 30 L 0 25 L 10 30 L 2 15 Z" fill="white"/>
    </g>
  </g>
  
  <text x="50" y="32" fill="white" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="bold" letter-spacing="2">云鹰智能体</text>
  <rect x="1.5" y="1.5" width="210" height="45" stroke="#4BB649" stroke-width="3" rx="5"/>
</svg>